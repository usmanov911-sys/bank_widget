[tool.poetry]
name = "pythonprojectgit"
version = "0.1.0"
description = ""
authors = ["Артур <usmanov911@gmail.com>"]

packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = "^3.14"
python-dotenv = "^1.2.2"
requests = "^2.34.2"
pandas = "^2.0.0"
openpyxl = "^3.1.0"

[tool.black]
line-length = 100 # Или ваше значение
target-version = ["py311"]
include = "\\.pyi?$"
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv/*
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
no_implicit_optional = true
warn_return_any = true

[tool.lint]
group = "lint"
optional = []
packages = ["src"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
